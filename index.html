<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIC Academic — Practice Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  onload="window.__katexReady=true"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/sql-wasm.js"></script>

<style>
/* ─── Reset & Base ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f5fb;color:#1a1a2e;min-height:100vh;overflow-x:hidden}

/* ─── CSS Variables ─── */
:root{
  --brand:#6C3FF5;--brand-light:#f0ebff;
  --ph:#6C3FF5;--ch:#E53E3E;--ma:#2563EB;--bio:#16a34a;
  --sidebar-w:256px;--topbar-h:56px;
  --radius:12px;--radius-lg:18px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --trans:.15s ease;
  --notes-bg:#F3EEFF;--notes-bg-soft:#FAF7FF;--ink-blue:#1E3A8A;
}

/* ─── Layout ─── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ─── Top Bar ─── */
#topbar{
  height:var(--topbar-h);background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;align-items:center;gap:12px;
  padding:0 16px;z-index:30;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.06)
}
#logo-box{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:11px;letter-spacing:.5px
}
#brand-name{font-weight:700;font-size:14px;color:#111;white-space:nowrap}
#sidebar-toggle{
  background:none;border:none;cursor:pointer;padding:7px;
  border-radius:8px;color:#6b7280;transition:background var(--trans)
}
#sidebar-toggle:hover{background:#f3f4f6}
#sidebar-toggle svg{display:block;width:20px;height:20px}

/* Subject tabs */
#subject-tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
#subject-tabs::-webkit-scrollbar{display:none}
.subj-tab{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:9px;border:1.5px solid transparent;
  font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all var(--trans);background:none;
}
.subj-tab .emoji{font-size:15px;line-height:1}
.subj-tab span{font-size:13px}

/* User avatar */
#user-btn{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  border:none;cursor:pointer;color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  margin-left:auto;flex-shrink:0;transition:transform var(--trans)
}
#user-btn:hover{transform:scale(1.08)}
#user-dropdown{
  position:absolute;right:16px;top:52px;background:#fff;
  border:1px solid #e5e7eb;border-radius:14px;padding:14px;
  min-width:200px;box-shadow:var(--shadow-md);z-index:100;
  display:none
}
#user-dropdown.open{display:block}
#user-dropdown .uname{font-weight:600;font-size:13px;color:#111}
#user-dropdown .uemail{font-size:11px;color:#9ca3af;margin-top:2px}
#user-dropdown hr{border:none;border-top:1px solid #f3f4f6;margin:10px 0}
#user-dropdown a,.dropdown-btn{
  display:flex;align-items:center;gap:7px;font-size:12px;
  color:#6b7280;text-decoration:none;background:none;border:none;
  cursor:pointer;padding:4px 0;transition:color var(--trans);width:100%
}
#user-dropdown a:hover,.dropdown-btn:hover{color:#7c3aed}
.dropdown-btn.danger{color:#ef4444}
.dropdown-btn.danger:hover{color:#b91c1c}
#dd-guest-note{font-size:11px;color:#9ca3af;line-height:1.6;margin-top:8px}

/* ─── Body ─── */
#body{display:flex;flex:1;overflow:hidden}

/* ─── Sidebar ─── */
#sidebar{
  width:var(--sidebar-w);background:#fff;
  border-right:1px solid #e5e7eb;
  display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0;
  transition:width var(--trans),opacity var(--trans)
}
#sidebar.closed{width:0;opacity:0;pointer-events:none}
#sidebar-subject-header{
  padding:12px 16px;border-bottom:1px solid #f3f4f6;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase
}
#sidebar-tree{flex:1;overflow-y:auto;padding:6px 0}
#sidebar-tree::-webkit-scrollbar{width:3px}
#sidebar-tree::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}

/* Unit */
.unit-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;background:none;border:none;cursor:pointer;
  font-size:12px;font-weight:600;color:#374151;text-align:left;
  transition:background var(--trans)
}
.unit-btn:hover{background:#f9fafb}
.unit-btn .chevron{width:14px;height:14px;transition:transform .2s;color:#9ca3af;flex-shrink:0}
.unit-btn.collapsed .chevron{transform:rotate(-90deg)}

/* Chapter */
.chapter-list{padding:0 0 4px 14px;border-left:2px solid #f3f4f6;margin-left:14px}
.chapter-list.hidden{display:none}
.chap-btn{
  width:100%;text-align:left;padding:8px 10px;
  border:none;cursor:pointer;border-radius:9px;
  font-size:11.5px;font-weight:500;color:#6b7280;
  background:none;margin-bottom:2px;transition:all var(--trans)
}
.chap-btn:hover{background:#f9fafb;color:#111}
.chap-btn.active{color:#fff}
.chap-progress{display:flex;align-items:center;gap:6px;margin-top:5px}
.chap-progress-bar{flex:1;height:3px;border-radius:2px;background:#e5e7eb;overflow:hidden}
.chap-progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.chap-progress-label{font-size:10px;color:inherit;opacity:.7}

/* ─── Main ─── */
#main{flex:1;overflow-y:auto;padding:24px 20px}
#main::-webkit-scrollbar{width:4px}
#main::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px}

/* ─── Concept Panel ─── */
#question-wrap{max-width:760px;margin:0 auto}
.concept-card{
  background:var(--notes-bg-soft);border-radius:var(--radius-lg);border:1px solid #e3d9fb;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px
}
.concept-header{
  display:flex;align-items:center;gap:12px;
  padding:16px 22px;cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;transition:border-color var(--trans);
  background:var(--notes-bg)
}
.concept-header.open{border-bottom-color:#e3d9fb}
.concept-icon{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff
}
.concept-title-wrap{flex:1;min-width:0}
.concept-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;color:var(--ink-blue)}
.concept-title{font-size:18px;font-weight:700;color:var(--ink-blue);margin-top:2px;line-height:1.3}
.concept-chevron{width:20px;height:20px;color:#9ca3af;flex-shrink:0;transition:transform .25s ease}
.concept-chevron.open{transform:rotate(180deg)}
.concept-body{padding:0 24px 24px;display:none;background:var(--notes-bg-soft)}
.concept-body.open{display:block;animation:fadeUp .2s ease-out}
.concept-para{font-size:15.5px;line-height:1.9;color:#374151;margin-bottom:15px}
.concept-para:last-child{margin-bottom:0}
.concept-para strong{color:var(--ink-blue);font-weight:700}
.concept-heading{font-size:16.5px;font-weight:700;color:var(--ink-blue);margin:16px 0 8px}
.concept-list{margin:6px 0 14px 20px;padding:0}
.concept-list li{margin-bottom:9px;line-height:1.8;font-size:15px;color:#374151}
.concept-note{
  margin:14px 0;padding:12px 15px;background:#e6bff2;
  border-left:4px solid #6b21a8;border-radius:8px;color:#4b5563;
  font-size:14px;line-height:1.7;box-shadow:0 3px 8px rgba(0,0,0,0.05)
}
.concept-syntax{margin:14px 0}
.syntax-title{font-size:11.5px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.concept-syntax pre{
  background:#1e1e2e;color:#e2e8f0;border-radius:10px;
  padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.7;
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}
.concept-formulas{
  margin-top:16px;padding:16px 18px;border-radius:12px;
  background:#f9fafb;border:1px solid #f0f0f0
}
.concept-formulas-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9ca3af;margin-bottom:10px}
.formula-chip{
  display:inline-block;background:#fff;border:1px solid #e5e7eb;
  border-radius:8px;padding:8px 14px;margin:0 7px 7px 0;
  font-size:14.5px;color:#1f2937
}
/* Concept Table */
.concept-table{
  width:100%;border-collapse:collapse;margin:18px 0;
  overflow:hidden;border-radius:10px;font-size:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.08)
}
.concept-table thead{background:#185C37;color:#fff}
.concept-table th,.concept-table td{padding:10px 12px;text-align:left}
.concept-table tbody tr:nth-child(even){background:#f8fafc}
.concept-table tbody tr:hover{background:#eef4ff}
.concept-table th{font-weight:700;font-size:13px}
.concept-table td,.concept-table th{border-bottom:1px solid #e5e7eb}
.table-wrapper{overflow-x:auto}

/* Exercise block — a boxed, numbered practice-book style list */
.concept-exercise{margin:16px 0;border-radius:12px;border:1.5px solid #fde68a;background:#fffbeb;overflow:hidden}
.exercise-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fef3c7;border-bottom:1px solid #fde68a}
.exercise-badge{font-size:11px;font-weight:800;color:#92400e;background:#fde68a;padding:3px 10px;border-radius:20px;letter-spacing:.03em;flex-shrink:0}
.exercise-title{font-size:14.5px;font-weight:700;color:#92400e}
.exercise-list{list-style:none;counter-reset:ex-counter;padding:14px 16px;margin:0}
.exercise-item{counter-increment:ex-counter;position:relative;padding:8px 0 8px 36px;font-size:14.5px;line-height:1.7;color:#374151;border-bottom:1px dashed #fde68a}
.exercise-item:last-child{border-bottom:none}
.exercise-item::before{content:counter(ex-counter);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:7px;background:#f59e0b;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Steps block — a vertical numbered walkthrough with a connecting rail */
.concept-steps{margin:16px 0}
.steps-title{font-size:15px;font-weight:700;color:var(--ink-blue);margin-bottom:10px}
.steps-list{list-style:none;counter-reset:step-counter;padding:0;margin:0;position:relative}
.steps-list::before{content:'';position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:#e5e7eb}
.steps-item{counter-increment:step-counter;display:flex;align-items:flex-start;gap:14px;padding:9px 0;position:relative}
.steps-number{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:1}
.steps-number::before{content:counter(step-counter)}
.steps-text{font-size:14.5px;line-height:1.75;color:#374151;padding-top:5px}

/* YouTube / video block */
.media-video{margin:14px 0}
.video-frame-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;background:#000}
.video-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.media-video-link{margin:14px 0}

/* ─── Question type tabs ─── */
.qtype-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.qtype-tab{
  padding:7px 16px;border-radius:9px;border:1.5px solid #e5e7eb;
  background:#fff;font-size:12.5px;font-weight:700;color:#6b7280;
  cursor:pointer;transition:all var(--trans)
}
.qtype-tab .qtype-count{
  display:inline-block;margin-left:5px;font-size:10.5px;
  background:#f3f4f6;color:#9ca3af;border-radius:10px;padding:1px 6px
}
.qtype-tab.active .qtype-count{background:rgba(255,255,255,.25);color:#fff}
.q-breadcrumb{font-size:11px;color:#9ca3af;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}

/* Progress row */
.q-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.q-progress-track{flex:1;height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.q-progress-fill{height:100%;border-radius:3px;transition:width .4s ease}
.q-progress-label{font-size:12px;font-weight:600;color:#9ca3af;white-space:nowrap}

/* Batch of question cards */
.q-batch{display:flex;flex-direction:column;gap:18px;margin-bottom:16px}
.q-batch-actions{display:flex;gap:10px;margin-top:2px}
.q-batch-actions .btn{flex:1;justify-content:center}

/* Card */
.q-card{background:#fff;border-radius:var(--radius-lg);border:1px solid #e5e7eb;box-shadow:var(--shadow);overflow:hidden}
.q-card-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;border-bottom:1px solid #f3f4f6
}
.q-type-badge{
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:20px;color:#fff;white-space:nowrap
}
.q-type-hint{font-size:12px;color:#9ca3af}
.q-num{margin-left:auto;font-size:12px;color:#c4c4c4;font-weight:600}
.q-body{padding:20px 22px}
.q-text{font-size:16px;color:#111;line-height:1.75;font-weight:500}
.q-options{padding:0 22px 20px;display:flex;flex-direction:column;gap:10px}

/* Options */
.opt{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:11px;border:2px solid #e5e7eb;
  background:#fff;cursor:pointer;text-align:left;
  transition:all var(--trans);width:100%;overflow:hidden
}
.opt:hover:not(.disabled){border-color:#a5b4fc;background:#f8f7ff;transform:translateX(2px)}
.opt.selected{border-color:var(--brand);background:#f0ebff}
.opt.correct{border-color:#16a34a;background:#f0fdf4}
.opt.missed{border-color:#86efac;background:#f0fdf4;opacity:.8}
.opt.wrong{border-color:#ef4444;background:#fef2f2}
.opt.disabled{cursor:default}
.opt-label{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  background:#f3f4f6;color:#6b7280;transition:all var(--trans)
}
.opt.selected .opt-label{background:var(--brand);color:#fff}
.opt.correct .opt-label{background:#16a34a;color:#fff}
.opt.missed .opt-label{background:#22c55e;color:#fff}
.opt.wrong .opt-label{background:#ef4444;color:#fff}
.opt-text{font-size:14.5px;color:#374151;line-height:1.65;flex:1;padding-top:2px;min-width:0}
.opt-text-inline{display:block;word-break:break-word}
.opt-img{
  display:block;max-width:100%;max-height:180px;width:auto;
  object-fit:contain;border-radius:8px;margin-bottom:8px;
  border:1px solid #e5e7eb;background:#f9fafb;cursor:zoom-in
}

/* NAT input */
.nat-wrap{padding:0 22px 4px}
.nat-input-row{display:flex;align-items:center;gap:10px}
.nat-input{
  flex:1;padding:13px 16px;border-radius:11px;border:2px solid #e5e7eb;
  font-size:15px;font-family:inherit;font-weight:600;color:#111;
  outline:none;transition:all var(--trans);background:#fff
}
.nat-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,63,245,.12)}
.nat-input.correct{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.nat-input.wrong{border-color:#ef4444;background:#fef2f2;color:#b91c1c}
.nat-unit{font-size:13px;color:#9ca3af;font-weight:600;white-space:nowrap}
.nat-correct-value{font-size:12.5px;color:#16a34a;margin-top:8px;font-weight:600}
.nat-hint{font-size:11.5px;color:#9ca3af;margin-top:6px}

/* Explanation */
.explanation{
  margin:0 22px 20px;padding:15px 17px;
  border-radius:12px;border:1.5px solid;font-size:14px;line-height:1.75
}
.explanation.correct{background:#f0fdf4;border-color:#86efac;color:#15803d}
.explanation.wrong{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
.explanation-head{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:5px;font-size:15px}

/* Actions */
.q-actions{padding:0 22px 20px;display:flex;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  border:none;cursor:pointer;transition:all var(--trans)
}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid #e5e7eb;color:#6b7280}
.btn-outline:hover:not(:disabled){background:#f9fafb;border-color:#d1d5db}
.btn-primary{color:#fff;flex:1;justify-content:center;box-shadow:0 2px 8px rgba(108,63,245,.3)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 4px 14px rgba(108,63,245,.4)}
.btn svg{width:16px;height:16px}

/* Dot navigator */
.q-dots{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.q-dot{height:6px;border-radius:3px;transition:all .25s ease;cursor:pointer}

/* ─── SQL Playground ─── */
.sql-playground{
  background:#fff;border-radius:var(--radius-lg);border:1px solid #e5e7eb;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px
}
.sql-pg-header{
  display:flex;align-items:center;gap:12px;padding:16px 22px;
  border-bottom:1px solid #f3f4f6;cursor:pointer;user-select:none
}
.sql-pg-icon{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;background:#0F9D8C;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff
}
.sql-pg-title-wrap{flex:1;min-width:0}
.sql-pg-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0F9D8C;opacity:.9}
.sql-pg-title{font-size:17px;font-weight:700;color:#111;margin-top:2px}
.sql-pg-body{padding:20px 22px}
.sql-pg-body.hidden{display:none}
.sql-schema-note{font-size:13.5px;color:#6b7280;line-height:1.7;margin-bottom:14px;background:#f9fafb;border:1px solid #f0f0f0;border-radius:10px;padding:12px 14px}
.sql-schema-note code{background:#eef2f7;padding:1px 6px;border-radius:5px;font-size:12.5px}
textarea#sql-editor{
  width:100%;min-height:120px;resize:vertical;
  background:#1e1e2e;color:#e2e8f0;border:none;border-radius:12px;
  padding:16px 18px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  font-size:14px;line-height:1.7;outline:none
}
.sql-pg-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sql-pg-actions .btn-outline{background:#f9fafb}
.sql-result-wrap{margin-top:16px}
.sql-result-msg{
  padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
  margin-bottom:10px
}
.sql-result-msg.ok{background:#f0fdf4;color:#15803d;border:1px solid #86efac}
.sql-result-msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.sql-result-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #e5e7eb}
table.sql-result-table{width:100%;border-collapse:collapse;font-size:13px}
table.sql-result-table thead{background:#0F9D8C;color:#fff}
table.sql-result-table th,table.sql-result-table td{padding:9px 12px;text-align:left;white-space:nowrap}
table.sql-result-table tbody tr:nth-child(even){background:#f8fafc}
.sql-sample-queries{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sql-sample-chip{
  font-size:12px;font-weight:600;color:#0F9D8C;background:#e6f7f4;
  border:1px solid #b9ece3;border-radius:20px;padding:6px 13px;cursor:pointer;
  transition:all var(--trans)
}
.sql-sample-chip:hover{background:#0F9D8C;color:#fff;border-color:#0F9D8C}

/* ─── Loading spinner ─── */
#loader{
  display:flex;align-items:center;justify-content:center;
  height:200px
}
.spinner{

// ══════════════════════════════════════════
//  UNIC ACADEMIC — Core App
// ══════════════════════════════════════════

const SUBJECTS = {
  PH:  { label:'Physics',     emoji:'⚡', color:'#6C3FF5', file:'data/physics.json' },
  CH:  { label:'Chemistry',   emoji:'🧪', color:'#E53E3E', file:'data/chemistry.json' },
  MA:  { label:'Mathematics', emoji:'∑',  color:'#2563EB', file:'data/mathematics.json' },
  BIO: { label:'Biology',     emoji:'🧬', color:'#16a34a', file:'data/biology.json' },
  SQL: { label:'SQL',         emoji:'⛁', color:'#0F9D8C', file:'data/sql.json' },
  EXCEL: { label:'EXCEL',     emoji:'𝄜', color:'#217346', file:'data/excel.json' },
  PY:  { label:'Python',      emoji:'🐍', color:'#3776AB', file:'data/python.json' },
  R:  { label:'R Program',    emoji:'R', color:'#1F65B7', file:'data/rprog.json' },
  MAP:  { label:'Math Aptitude',    emoji:'📐', color:'#B7791F', file:'data/mathapti.json' },
};
const subjectRootCache = {};

const LABELS = ['A','B','C','D','E'];
const BATCH_SIZE = 3;

const DEFAULT_SQL_SCHEMA = `CREATE TABLE Student (
  Roll_No INT PRIMARY KEY,
  Name VARCHAR(30),
  Class VARCHAR(5),
  Marks INT
);

INSERT INTO Student VALUES (1, 'Riya', '10A', 88);
INSERT INTO Student VALUES (2, 'Aman', '10B', 72);
INSERT INTO Student VALUES (3, 'Zoya', '10A', 95);
INSERT INTO Student VALUES (4, 'Kabir', '10B', 64);
INSERT INTO Student VALUES (5, 'Meera', '10A', 79);
INSERT INTO Student VALUES (6, 'Vihaan', '10C', 58);`;

const DEFAULT_SQL_QUERIES = [
  'SELECT * FROM Student;',
  "SELECT Name, Marks FROM Student WHERE Class = '10A';",
  'SELECT Class, AVG(Marks) FROM Student GROUP BY Class;',
  'SELECT * FROM Student ORDER BY Marks DESC;',
  "UPDATE Student SET Marks = 90 WHERE Name = 'Aman';",
];

function getActivePlayground() {
  const chapter = getCurrentChapter();
  const pg = chapter?.playground;
  return {
    schema: pg?.schema || DEFAULT_SQL_SCHEMA,
    sampleQueries: (pg?.sampleQueries && pg.sampleQueries.length) ? pg.sampleQueries : DEFAULT_SQL_QUERIES,
  };
}

// ── State ──
let state = {
  view: 'home', // 'home' | 'categories' | 'subject' | 'dashboard'
  config: null,
  activeSubject: 'PH',
  subjectMeta: null,
  activeCategoryId: null,
  subjectData: null,
  activeChapterId: null,
  questionIndex: 0,
  answers: {},
  submitted: {},
  sidebarOpen: true,
  userData: null,
  conceptOpen: true,
  qtypeFilter: 'ALL',
  sqlPgOpen: true,
  sqlDb: null,
  sqlJsLoading: null,
  sqlLoadedChapterId: null,
  modalMode: 'register',
  dashboardStats: null,
  feedbackStats: null,
  feedbackRating: 0,
};


// ── Utilities ──
function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16),g = parseInt(hex.slice(3,5),16),b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function subjectColor() { return SUBJECTS[state.activeSubject].color; }

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ── AJAX helper ──
function ajax(url, method='GET', data=null) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    if (data) xhr.setRequestHeader('Content-Type','application/json');
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { resolve(xhr.responseText); }
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send(data ? JSON.stringify(data) : null);
  });
}

// ── KaTeX rendering ──
function renderLatex(el) {
  if (!el) return;
  function tryRender() {
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false},
          {left:'\\(',right:'\\)',display:false},
          {left:'\\[',right:'\\]',display:true},
        ],
        throwOnError:false
      });
    } else {
      setTimeout(tryRender, 100);
    }
  }
  tryRender();
}

async function fetchJSON(remoteQuery, staticFile) {
  if (remoteQuery) {
    try {
      const remote = await ajax(remoteQuery);
      if (remote && remote.data && (remote.data.units || remote.data.categories)) {
        return remote.data;
      }
    } catch { /* fall through to static file */ }
  }
  return ajax(staticFile);
}

async function loadSubjectRoot(code) {
  showLoader();

  let loaded = subjectRootCache[code];
  if (!loaded) {
    try {
      loaded = await fetchJSON(`api/content11?code=${code}`, SUBJECTS[code].file);
    } catch {
      document.getElementById('question-wrap').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Failed to load subject data</p></div>';
      return;
    }
    subjectRootCache[code] = loaded;
  }

  if (loaded && Array.isArray(loaded.categories) && loaded.categories.length) {
    state.subjectMeta = loaded;
    state.subjectData = null;
    state.activeCategoryId = null;
    state.view = 'categories';
    state.sidebarOpen = false;
    document.getElementById('sidebar').classList.add('closed');
    renderCategoriesHTML();
  } else {
    state.subjectMeta = null;
    state.view = 'subject';
    state.sidebarOpen = true;
    document.getElementById('sidebar').classList.remove('closed');
    applySubjectData(loaded);
  }
  updateActiveTabs();
}

function renderCategoriesHTML() {
  const wrap = document.getElementById('question-wrap');
  const meta = state.subjectMeta;
  const s = SUBJECTS[state.activeSubject];
  const color = s.color;
  const cats = meta?.categories || [];

  const groups = {};
  let hasGroups = false;
  cats.forEach(c => {
    const g = c.group || '';
    if (g) hasGroups = true;
    (groups[g] ||= []).push(c);
  });

  const cardHTML = c => `
      <button class="home-card" onclick="loadCategory('${c.id}')">

        <div class="home-card-cta" style="color:${color}">${c.subtitle || 'Start practising →'}</div>

    ? (hasGroups
        ? Object.keys(groups).map(g => `
            <div class="category-group">
              ${g ? `<div class="category-group-title">${g}</div>` : ''}
              <div class="home-grid">${groups[g].map(cardHTML).join('')}</div>

async function loadCategory(catId) {
  const cat = (state.subjectMeta?.categories || []).find(c => c.id === catId);
  if (!cat) return;

  showLoader();

  let loaded = null;
  if (cat.units) {
    loaded = { subject: state.subjectMeta.subject, units: cat.units, playground: cat.playground };
  } else if (cat.file) {
    try {
      loaded = await ajax(cat.file);
      if (!loaded.subject) loaded.subject = `${state.subjectMeta.subject} — ${cat.title}`;
    } catch {
      document.getElementById('question-wrap').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Failed to load this topic\'s data</p></div>';
      return;
    }
  }

  if (!loaded || !loaded.units) {
    document.getElementById('question-wrap').innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No questions available for this topic yet</p></div>';
    return;
  }

  state.activeCategoryId = cat.id;
  state.view = 'subject';
  state.sidebarOpen = true;
  document.getElementById('sidebar').classList.remove('closed');
  applySubjectData(loaded);
}

function applySubjectData(loaded) {
  state.subjectData = loaded;
  state.answers = {};
  state.submitted = {};
  state.qtypeFilter = 'ALL';
  state.conceptOpen = true;
  state.questionIndex = 0;

  const firstChapter = state.subjectData.units?.[0]?.chapters?.[0];
  state.activeChapterId = firstChapter ? firstChapter.id : null;

  buildSidebar();
  renderQuestion();
}

function backToCategories() {
  if (!state.subjectMeta) { showHome(); return; }

  state.activeCategoryId = null;
  state.sidebarOpen = false;
  document.getElementById('sidebar').classList.add('closed');

function buildSidebar() {
  const data = state.subjectData;
  if (!data) return;
  const color = subjectColor();
  const hdr = document.getElementById('sidebar-subject-header');
  hdr.textContent = data.subject;

  tree.innerHTML = '';

  data.units?.forEach((unit, ui) => {
    const unitBtn = document.createElement('button');
    unitBtn.className = 'unit-btn';
    unitBtn.innerHTML = `<span>${unit.title}</span><svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>`;
    unitBtn.addEventListener('click', () => {
      unitBtn.classList.toggle('collapsed');
      chapList.classList.toggle('hidden');
    });
    tree.appendChild(unitBtn);

    const chapList = document.createElement('div');
    chapList.className = 'chapter-list';
    chapList.id = `chaplist-${unit.id}`;

    unit.chapters?.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'chap-btn';
      btn.id = `chap-${ch.id}`;
      btn.dataset.chapterId = ch.id;

      const total = ch.questions?.length || 0;
      const done = ch.questions?.filter(q => state.submitted[q.id]).length || 0;
      const pct = total ? Math.round(done/total*100) : 0;

      btn.innerHTML = `
        <div style="font-size:11.5px">${ch.title}</div>
        <div class="chap-progress">
          <div class="chap-progress-bar"><div class="chap-progress-fill" style="width:${pct}%;background:${color}"></div></div>
          <span class="chap-progress-label">${done}/${total}</span>
        </div>`;

      btn.addEventListener('click', () => selectChapter(ch.id));
      chapList.appendChild(btn);
    });

    tree.appendChild(chapList);
  });

  updateSidebarActive();
}

function updateSidebarActive() {
  const color = subjectColor();
  document.querySelectorAll('.chap-btn').forEach(btn => {
    const isActive = btn.dataset.chapterId === state.activeChapterId;
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? color : '';
    btn.style.color = isActive ? '#fff' : '';
  });
}

function updateSidebarBackButton() {
  const row = document.getElementById('sidebar-category-nav');
  if (!row) return;
  const cats = state.subjectMeta?.categories;
  if (cats && cats.length) {
    row.classList.remove('hidden');
    const cat = cats.find(c => c.id === state.activeCategoryId);
    document.getElementById('sidebar-back-label').textContent = cat ? `Change (${cat.title})` : 'Change Class / Topic';
  } else {
    row.classList.add('hidden');
  }
}

function updateChapterProgress(chapterId) {
  const allChapters = getAllChapters();
  const ch = allChapters.find(c => c.id === chapterId);
  if (!ch) return;
  const total = ch.questions?.length || 0;
  const done = ch.questions?.filter(q => state.submitted[q.id]).length || 0;
  const pct = total ? Math.round(done/total*100) : 0;
  const btn = document.getElementById(`chap-${chapterId}`);
  if (!btn) return;
  const fill = btn.querySelector('.chap-progress-fill');
  const label = btn.querySelector('.chap-progress-label');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${done}/${total}`;
}

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function getAllChapters() {
  return state.subjectData?.units?.flatMap(u => u.chapters) || [];
}

function getCurrentChapter() {
  return getAllChapters().find(c => c.id === state.activeChapterId);
}

function getAllQuestions() {
  return getCurrentChapter()?.questions || [];
}

function getQuestions() {
  const all = getAllQuestions();
  if (state.qtypeFilter === 'ALL') return all;
  return all.filter(q => q.type === state.qtypeFilter);
}

function getTypeCounts() {
  const all = getAllQuestions();
  return {
    ALL: all.length,
    MCQ: all.filter(q => q.type === 'MCQ').length,
    MSQ: all.filter(q => q.type === 'MSQ').length,
    NAT: all.filter(q => q.type === 'NAT').length,
  };
}

function switchSubject(code) {
  const sameSubjectAlreadyActive = state.view === 'subject' && code === state.activeSubject;

  if (sameSubjectAlreadyActive) {
    if (state.subjectMeta?.categories?.length) {
      backToCategories();
    }
    return;
  }

  state.activeSubject = code;
  state.activeCategoryId = null;
  loadSubjectRoot(code);
}

function selectChapter(chapterId) {
  state.activeChapterId = chapterId;
  state.questionIndex = 0;
  state.qtypeFilter = 'ALL';
  state.conceptOpen = true;
  updateSidebarActive();
  renderQuestion();
  if (window.innerWidth < 640) {
    state.sidebarOpen = false;
    document.getElementById('sidebar').classList.add('closed');
  }
}

function goNext() {
  const qs = getQuestions();
  const nextStart = state.questionIndex + BATCH_SIZE;
  if (nextStart < qs.length) {
    state.questionIndex = nextStart;
    renderQuestion();
  } else {
    const all = getAllChapters();
    const idx = all.findIndex(c => c.id === state.activeChapterId);
    if (idx < all.length - 1) {
      state.activeChapterId = all[idx+1].id;
      state.questionIndex = 0;
      updateSidebarActive();
      renderQuestion();
    }
  }
}

function goPrev() {
  if (state.questionIndex > 0) {
    state.questionIndex = Math.max(0, state.questionIndex - BATCH_SIZE);
    renderQuestion();
  } else {
    const all = getAllChapters();
    const idx = all.findIndex(c => c.id === state.activeChapterId);
    if (idx > 0) {
      const prev = all[idx-1];
      state.activeChapterId = prev.id;
      const prevTotal = prev.questions?.length || 0;
      state.questionIndex = prevTotal ? Math.floor((prevTotal - 1) / BATCH_SIZE) * BATCH_SIZE : 0;
      updateSidebarActive();
      renderQuestion();
    }
  }
}

function canGoNext() {
  const qs = getQuestions();
  if (state.questionIndex + BATCH_SIZE < qs.length) return true;
  const all = getAllChapters();
  return all.findIndex(c => c.id === state.activeChapterId) < all.length - 1;
}

function canGoPrev() {
  if (state.questionIndex > 0) return true;
  const all = getAllChapters();
  return all.findIndex(c => c.id === state.activeChapterId) > 0;
}

function formatText(text = "") {
  return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// ══════════════════════════════════════════
//  MEDIA (image / pdf)
// ══════════════════════════════════════════
function resolveMediaSrc(val, kind) {
  if (!val || typeof val !== 'string') return '';
  const v = val.trim();
  if (/^(https?:)?\/\//.test(v) || v.startsWith('/') || v.startsWith('./') || v.startsWith('data:')) {
    return v;
  }
  const mime = kind === 'pdf' ? 'application/pdf' : 'image/png';
  return `data:${mime};base64,${v}`;
}

function looksLikeImageString(v) {
  if (typeof v !== 'string') return false;
  const s = v.trim();
  if (!s) return false;
  if (s.startsWith('data:image')) return true;
  if (/^(https?:)?\/\//.test(s) && /\.(png|jpe?g|gif|webp|svg|bmp)(\?.*)?$/i.test(s)) return true;
  if (/^(\.{0,2}\/)?[\w\-\/]+\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(s)) return true;
  if (s.length > 100 && !/\s/.test(s) && /^[A-Za-z0-9+/=]+$/.test(s)) return true;
  return false;
}

function renderImageBlock(imgVal, title = '') {
  if (!imgVal) return '';
  const src = resolveMediaSrc(imgVal, 'image');
  if (!src) return '';
  return `<div class="media-image">${title ? `<div class="media-title">${escapeHtml(title)}</div>` : ''}<img src="${src}" alt="${escapeHtml(title)}" loading="lazy" onclick="openLightbox('${src.replace(/'/g,"\\'")}')"></div>`;
}

function renderPdfBlock(pdfVal, title = '') {
  if (!pdfVal) return '';
  const src = resolveMediaSrc(pdfVal, 'pdf');
  if (!src) return '';
  return `<div class="media-pdf">${title ? `<div class="media-title">${escapeHtml(title)}</div>` : ''}
    <iframe src="${src}" title="attached pdf"></iframe>
    <a class="media-pdf-link" href="${src}" target="_blank" rel="noopener">Open PDF in new tab ↗</a>
  </div>`;
}

function extractYouTubeId(url) {
  if (!url || typeof url !== 'string') return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function parseTimeToSeconds(val) {
  if (val === undefined || val === null || val === '') return 0;
  if (typeof val === 'number') return Math.max(0, Math.floor(val));
  const parts = String(val).split(':').map(p => parseInt(p, 10) || 0);
  let secs = 0;
  parts.forEach(p => { secs = secs * 60 + p; });
  return Math.max(0, secs);
}

function renderVideoBlock(url, title = '', start) {
  if (!url) return '';
  const id = extractYouTubeId(url);
  if (!id) {
    return `<div class="media-video-link"><a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="media-pdf-link">▶ ${escapeHtml(title || 'Watch video')}</a></div>`;
  }
  const startSecs = parseTimeToSeconds(start);
  const src = `https://www.youtube.com/embed/${id}?rel=0${startSecs ? `&start=${startSecs}` : ''}`;
  return `<div class="media-video">
    ${title ? `<div class="media-title">${escapeHtml(title)}</div>` : ''}
    <div class="video-frame-wrap"><iframe src="${src}" title="${escapeHtml(title || 'video')}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>`;
}

function renderOptionContent(opt) {
  if (opt && typeof opt === 'object' && !Array.isArray(opt)) {
    const text = opt.text ?? opt.label ?? '';
    const imgVal = opt.image || opt.src || opt.path || opt.url;
    const pdfVal = opt.pdf;
    let html = '';
    if (imgVal) {
      const src = resolveMediaSrc(imgVal, 'image');
      if (src) html += `<img src="${src}" alt="" loading="lazy" class="opt-img" onclick="event.stopPropagation();openLightbox('${src.replace(/'/g,"\\'")}')">`;
    }
    if (pdfVal) html += renderPdfBlock(pdfVal);
    if (text) html += `<span class="opt-text-inline">${formatText(String(text))}</span>`;
    return html || '&nbsp;';
  }

  if (looksLikeImageString(opt)) {
    const src = resolveMediaSrc(opt, 'image');
    return `<img src="${src}" alt="" loading="lazy" class="opt-img" onclick="event.stopPropagation();openLightbox('${src.replace(/'/g,"\\'")}')">`;
  }

  return formatText(String(opt ?? ''));
}

function renderConceptBody(body = []) {
  return body
    .map((item) => {
      if (typeof item === "string") {
        return `<p class="concept-para">${formatText(item)}</p>`;
      }

      switch (item.type) {
        case "heading":
          return `<h4 class="concept-heading">${formatText(item.text)}</h4>`;

        case "paragraph":
          return `<p class="concept-para">${formatText(item.text)}</p>`;

        case "list":
          return `
            ${
                item.title
                  ? `<div class="syntax-title">${item.title}</div>`
                  : ""
              }
            <ul class="concept-list">
              ${item.items
                .map((i) => `<li>${formatText(i)}</li>`)
                .join("")}
            </ul>
          `;

        case "note":
          return `
            <div class="concept-note">
              💡 ${formatText(item.text)}
            </div>
          `;

         case "tip":
          return `
            <div class="concept-note">
              💡 ${formatText(item.text)}
            </div>
          `;

        case "syntax":
          return `
            <div class="concept-syntax">
              ${
                item.title
                  ? `<div class="syntax-title">${item.title}</div>`
                  : ""
              }
              <pre><code>${item.code}</code></pre>
            </div>
          `;

        case "image":
          return renderImageBlock(item.src || item.image || item.path || item.url, item.title);
        case "pdf":
          return renderPdfBlock(item.src || item.pdf || item.path || item.url, item.title);

        case "video":
          return renderVideoBlock(item.url || item.src || item.youtube, item.title, item.start || item.startAt);

        case "exercise":
          return `
          ${renderImageBlock(item.image, '')}${renderPdfBlock(item.pdf, '')}
          <div class="concept-exercise">

        }

        case "table":

            ${item.title ? `<h5">${formatText(item.title)}</h5>` : ""}

function renderTypeTabsHTML() {

// ══════════════════════════════════════════
//  RENDER QUESTION (batch of 3 at a time)
// ══════════════════════════════════════════
function renderQuestion() {
  const wrap = document.getElementById('question-wrap');
  const chapter = getCurrentChapter();
  const color = subjectColor();
  const conceptHTML = renderConceptHTML(chapter, color);
  const sqlPgHTML = state.activeSubject === 'SQL' ? renderSqlPlaygroundHTML() : '';
  const tabsHTML = renderTypeTabsHTML();

  const questions = getQuestions();
  const totalQ = questions.length;
  const batch = questions.slice(state.questionIndex, state.questionIndex + BATCH_SIZE);

  if (!batch.length) {
    wrap.innerHTML = `
      <div class="fade-in">
        ${conceptHTML}
        ${sqlPgHTML}
        ${tabsHTML}
        <div class="empty"><div class="empty-icon">📭</div><p>No ${state.qtypeFilter !== 'ALL' ? state.qtypeFilter : ''} questions in this chapter</p></div>
      </div>`;
    if (chapter?.concept?.latex && state.conceptOpen) renderLatex(document.getElementById('concept-body'));
    bindSqlPlaygroundEvents();
    return;
  }

  const batchStart = state.questionIndex;
  const batchEnd = Math.min(batchStart + batch.length, totalQ);
  const pct = (batchEnd / totalQ) * 100;

  const cardsHTML = batch.map((q, bi) => renderSingleQuestionCard(q, batchStart + bi, color)).join('');

  const totalBatches = Math.ceil(totalQ / BATCH_SIZE);
  const currentBatch = Math.floor(state.questionIndex / BATCH_SIZE);
  let dotsHTML = '<div class="q-dots">';
  for (let i = 0; i < totalBatches; i++) {
    const w = i === currentBatch ? '18px' : '6px';
    const bg = i === currentBatch ? color : '#d1d5db';
    dotsHTML += `<div class="q-dot" style="width:${w};background:${bg}" onclick="goToDot(${i * BATCH_SIZE})"></div>`;
  }
  dotsHTML += '</div>';

  wrap.innerHTML = `
    <div class="fade-in">
      ${conceptHTML}
      ${sqlPgHTML}
      ${tabsHTML}
      <div class="q-breadcrumb">${chapter?.title || ''}</div>
      <div class="q-progress-row">
        <div class="q-progress-track"><div class="q-progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="q-progress-label">${batchStart+1}-${batchEnd} / ${totalQ}</span>
      </div>
      <div class="q-batch">
        ${cardsHTML}
      </div>
      <div class="q-batch-actions">
        <button class="btn btn-outline" onclick="goPrev()" ${!canGoPrev()?'disabled':''}>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Prev 3
        </button>
        <button class="btn btn-primary" onclick="goNext()" ${!canGoNext()?'disabled':''} style="background:${color}">Next 3 <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
      </div>
      ${dotsHTML}
    </div>`;

  if (chapter?.concept?.latex || batch.some(q => q.latex)) {
    renderLatex(wrap);
  }

  batch.forEach(q => {
    if (q.type === 'NAT' && !state.submitted[q.id]) {
      const natInput = document.getElementById(`nat-input-${q.id}`);
      if (natInput) {
        natInput.addEventListener('input', () => handleNatInput(q.id));
      }
    }
  });

  bindSqlPlaygroundEvents();
}

function renderSingleQuestionCard(q, absoluteIndex, color) {
  const selected = state.answers[q.id] ?? (q.type === 'NAT' ? '' : []);
  const isSubmitted = !!state.submitted[q.id];

  let bodyHTML = '';
  if (q.type === 'NAT') {
    bodyHTML = renderNATHTML(q, isSubmitted);
  } else {
    let optionsHTML = '';
    q.options.forEach((opt, i) => {
      let cls = 'opt';
      let labelContent = LABELS[i];
      if (isSubmitted) {
        cls += ' disabled';
        const isCorrect = q.answer.includes(i);
        const isSel = (selected || []).includes(i);
        if (isCorrect && isSel)  { cls += ' correct'; labelContent = '✓'; }
        else if (isCorrect)       { cls += ' missed';  labelContent = '✓'; }
        else if (isSel)           { cls += ' wrong';   labelContent = '✗'; }
      } else {
        if ((selected || []).includes(i)) cls += ' selected';
      }
      optionsHTML += `
        <button class="${cls}" data-idx="${i}" onclick="toggleOption('${q.id}', ${i})">
          <span class="opt-label">${labelContent}</span>
          <span class="opt-text">${renderOptionContent(opt)}</span>
        </button>`;
    });
    bodyHTML = `<div class="q-options">${optionsHTML}</div>`;
  }

  let exHTML = '';
  if (isSubmitted && (q.explanation || q.explanationImage || q.explanationPdf)) {
    const isRight = checkIsCorrect(q, selected);
    const cls = isRight ? 'correct' : 'wrong';
    const icon = isRight ? '🎉' : '💡';
    const head = isRight ? 'Correct!' : "Not quite — here's why:";
    exHTML = `<div class="explanation ${cls}">
      <div class="explanation-head">${icon} ${head}</div>
      ${q.explanation ? `<div class="exp-text">${q.explanation}</div>` : ''}
      ${renderImageBlock(q.explanationImage)}
      ${renderPdfBlock(q.explanationPdf)}
    </div>`;
  }

  const hasAnswer = q.type === 'NAT'
    ? (selected !== undefined && selected !== null && String(selected).trim() !== '')
    : (selected && selected.length > 0);

  let actionHTML = '';
  if (!isSubmitted) {
    actionHTML = `<div class="q-actions"><button class="btn btn-primary" id="btn-check-${q.id}" onclick="submitAnswer('${q.id}')" ${!hasAnswer?'disabled':''} style="background:${color}">Check Answer</button></div>`;
  }

  let typeHintHTML = '';
  if (q.type === 'MSQ') typeHintHTML = '<span class="q-type-hint">Select all correct answers</span>';
  else if (q.type === 'NAT') typeHintHTML = '<span class="q-type-hint">Type a number or a word</span>';

  return `
    <div class="q-card fade-in">
      <div class="q-card-header" style="background:${hex2rgba(color,.06)}">
        <span class="q-type-badge" style="background:${color}">${q.type}</span>
        ${typeHintHTML}
        <span class="q-num">Q${absoluteIndex+1}</span>
      </div>
      <div class="q-body">
        <div class="q-text q-question">${q.question}</div>
      </div>
      ${(q.image || q.pdf) ? `<div class="q-media">${renderImageBlock(q.image)}${renderPdfBlock(q.pdf)}</div>` : ''}
      ${bodyHTML}
      ${exHTML}
      ${actionHTML}
    </div>`;
}

function renderNATHTML(q, isSubmitted) {
  const selected = state.answers[q.id];
  let inputCls = 'nat-input';
  let valueAttr = selected ?? '';
  let correctNoteHTML = '';

  if (isSubmitted) {
    const isRight = checkIsCorrect(q, selected);
    inputCls += isRight ? ' correct' : ' wrong';
    if (!isRight) {
      correctNoteHTML = `<div class="nat-correct-value">✓ Correct answer: ${q.answer}${q.unit ? ' ' + q.unit : ''}</div>
        ${renderImageBlock(q.answerImage)}`;
    }
  }

  return `
    <div class="nat-wrap">
      <div class="nat-input-row">
        <input
          type="text"
          class="${inputCls}"
          id="nat-input-${q.id}"
          placeholder="Enter your answer"
          value="${escapeHtml(valueAttr)}"
          ${isSubmitted ? 'disabled' : ''}
        >
        ${q.unit ? `<span class="nat-unit">${q.unit}</span>` : ''}
      </div>
      ${!isSubmitted ? '<div class="nat-hint">Numbers and short text answers are both accepted.</div>' : ''}
      ${correctNoteHTML}
    </div>`;
}

function handleNatInput(qid) {
  const el = document.getElementById(`nat-input-${qid}`);
  if (!el) return;
  state.answers[qid] = el.value;
  const checkBtn = document.getElementById(`btn-check-${qid}`);
  if (checkBtn) checkBtn.disabled = el.value.trim() === '';
}

function checkIsCorrect(q, selected) {
  if (q.type === 'NAT') {
    if (selected === undefined || selected === null || String(selected).trim() === '') return false;
    if (typeof q.answer === 'number') {
      const val = parseFloat(selected);
      if (isNaN(val)) return false;
      const tol = q.tolerance ?? 0;
      return Math.abs(val - q.answer) <= tol;
    }
    return String(selected).trim().toLowerCase() === String(q.answer).trim().toLowerCase();
  }
  return JSON.stringify([...(selected||[])].sort((a,b)=>a-b)) === JSON.stringify([...q.answer].sort((a,b)=>a-b));
}

function goToDot(batchStartIndex) {
  state.questionIndex = batchStartIndex;
  renderQuestion();
}

// ══════════════════════════════════════════
//  ANSWER HANDLING
// ══════════════════════════════════════════
function toggleOption(qid, idx) {
  const q = getQuestions().find(qq => qq.id === qid);
  if (!q || state.submitted[q.id] || q.type === 'NAT') return;
  const prev = state.answers[q.id] || [];
  if (q.type === 'MCQ') {
    state.answers[q.id] = [idx];
  } else {
    const has = prev.includes(idx);
    state.answers[q.id] = has ? prev.filter(x=>x!==idx) : [...prev, idx];
  }
  renderQuestion();
}

function submitAnswer(qid) {
  const q = getQuestions().find(qq => qq.id === qid);
  if (!q || state.submitted[q.id]) return;
  const selected = state.answers[q.id];

  if (q.type === 'NAT') {
    if (selected === undefined || selected === null || String(selected).trim() === '') return;
  } else {
    if (!selected || !selected.length) return;
  }

  state.submitted[q.id] = true;

  if (state.userData) {
    const isCorrect = checkIsCorrect(q, selected);
    ajax('api/attempt', 'POST', {
      userId: state.userData.email || state.userData.name || 'guest',
      questionId: q.id,
      subject: state.activeSubject,
      chapterId: state.activeChapterId,
      questionType: q.type,
      selected,
      correct: q.answer,
      isCorrect,
      timestamp: new Date().toISOString()
    }).catch(()=>{});
  }

  updateChapterProgress(state.activeChapterId);
  renderQuestion();
}

async function ensureSqlEngine(forceRebuild = false) {
  const chapterId = state.activeChapterId;
  if (state.sqlDb && state.sqlLoadedChapterId === chapterId && !forceRebuild) {
    return state.sqlDb;
  }

  state.sqlJsLoading = (async () => {
    const SQL = await initSqlJs({
      locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.10.2/dist/${file}`
    });
    const db = new SQL.Database();
    const pg = getActivePlayground();
    try {
      db.run(pg.schema);
    } catch (e) {
      // starter schema was just an explanatory comment; fine
    }
    state.sqlDb = db;
    state.sqlLoadedChapterId = chapterId;
    return db;
  })();

  return state.sqlJsLoading;
}

async function runSqlQuery() {
  const editor = document.getElementById('sql-editor');
  const resultWrap = document.getElementById('sql-result-wrap');
  const runBtn = document.getElementById('sql-run-btn');
  if (!editor || !resultWrap) return;
  const sql = editor.value.trim();
  if (!sql) return;

  runBtn.disabled = true;
  runBtn.textContent = '⏳ Running…';
  resultWrap.innerHTML = '';

  try {
    const db = await ensureSqlEngine();
    const results = db.exec(sql);

    if (!results.length) {
      resultWrap.innerHTML = `<div class="sql-result-msg ok">✓ Query executed successfully. No rows to display (e.g. INSERT/UPDATE/DELETE/CREATE ran fine).</div>`;
    } else {
      let html = '';
      results.forEach(res => {
        html += `<div class="sql-result-msg ok">✓ ${res.values.length} row(s) returned</div>`;
        html += `<div class="sql-result-table-wrap"><table class="sql-result-table"><thead><tr>${res.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
        res.values.forEach(row => {
          html += `<tr>${row.map(cell => `<td>${cell === null ? '<em>NULL</em>' : cell}</td>`).join('')}</tr>`;
        });
        html += `</tbody></table></div>`;
      });
      resultWrap.innerHTML = html;
    }
  } catch (err) {
    resultWrap.innerHTML = `<div class="sql-result-msg err">✗ ${err.message}</div>`;
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '▶ Run Query';
  }
}

async function resetSqlPlayground() {
  const resultWrap = document.getElementById('sql-result-wrap');
  state.sqlDb = null;
  state.sqlLoadedChapterId = null;
  try {
    await ensureSqlEngine(true);
    if (resultWrap) resultWrap.innerHTML = `<div class="sql-result-msg ok">✓ Data reset — this chapter's sample table(s) restored to their original rows.</div>`;
  } catch (err) {
    if (resultWrap) resultWrap.innerHTML = `<div class="sql-result-msg err">✗ Could not reset: ${err.message}</div>`;
  }
}

  const statCardsHTML = `
    <div class="dash-grid">
      <div class="dash-stat-card">
        <div class="dash-stat-label">Total Attempted</div>
        <div class="dash-stat-value">${t.attempts}</div>
        <div class="dash-stat-sub">all-time questions</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">Correct</div>
        <div class="dash-stat-value" style="color:#16a34a">${t.correct}</div>
        <div class="dash-stat-sub">${t.accuracy}% accuracy</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">Wrong</div>
        <div class="dash-stat-value" style="color:#ef4444">${t.wrong}</div>
        <div class="dash-stat-sub">keep practising</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">This Week</div>
        <div class="dash-stat-value">${w.attempts}</div>
        <div class="dash-stat-sub">~${w.minutesPracticed} min practised</div>
      </div>
    </div>`;

  const maxSubjAttempts = Math.max(1, ...s.bySubject.map(x => x.attempts));
  const bySubjectHTML = s.bySubject.length ? s.bySubject.map(row => {
    const meta = subjectLabelFor(row.subject);
    const widthPct = Math.round((row.attempts / maxSubjAttempts) * 100);
    return `
      <div class="dash-subject-row">
        <div class="dash-subject-name">${meta.emoji} ${meta.label}</div>
        <div class="dash-subject-bar-track"><div class="dash-subject-bar-fill" style="width:${widthPct}%;background:${meta.color}"></div></div>
        <div class="dash-subject-pct">${row.correct}/${row.attempts} (${row.accuracy}%)</div>
      </div>`;
  }).join('') : '<div class="empty" style="height:100px"><div class="empty-icon">📭</div><p>No attempts yet — go practice a chapter!</p></div>';

  const maxDayAttempts = Math.max(1, ...s.last7Days.map(d => d.attempts));
  const weekChartHTML = `
    <div class="dash-week-chart">
      ${s.last7Days.map(d => {
        const h = d.attempts ? Math.max(6, Math.round((d.attempts / maxDayAttempts) * 100)) : 4;
        const dayLabel = new Date(d.date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
        return `
          <div class="dash-week-col">
            <div class="dash-week-bar-wrap"><div class="dash-week-bar" style="height:${h}%;background:var(--ink-blue)" title="${d.attempts} attempts, ${d.correct} correct, ~${d.minutesPracticed} min"></div></div>
            <div class="dash-week-day">${dayLabel}</div>
          </div>`;
      }).join('')}
    </div>`;

  wrap.innerHTML = `
    <div class="fade-in">
      <div class="home-hero"><h1>📊 Your Dashboard</h1><p>Hi ${escapeHtml(state.userData.name || 'there')} — here's how your practice is going</p></div>
      ${statCardsHTML}
      <div class="dash-section">
        <div class="dash-section-title">Accuracy by Subject</div>
        ${bySubjectHTML}
      </div>
      <div class="dash-section">
        <div class="dash-section-title">Last 7 Days</div>
        ${weekChartHTML}
      </div>
      ${renderFeedbackSectionHTML()}
    </div>`;
}

function renderFeedbackSectionHTML() {
  const fb = state.feedbackStats;
  const starsHTML = [1,2,3,4,5].map(n =>
    `<span class="feedback-star${n <= state.feedbackRating ? ' active' : ''}" onclick="setFeedbackRating(${n})">★</span>`
  ).join('');

  const statsHTML = fb ? `
    <div class="dash-stat-sub" style="margin-bottom:14px">
      ⭐ ${fb.averageRating || '—'} average from ${fb.count} response${fb.count === 1 ? '' : 's'} so far
    </div>` : '';

  return `
    <div class="dash-section">
      <div class="dash-section-title">Share Feedback</div>
      ${statsHTML}
      <div class="feedback-form">
        <div class="feedback-stars">${starsHTML}</div>
        <textarea class="feedback-textarea" id="feedback-message" placeholder="What's working well? What should we improve?"></textarea>
        <button style="max-width:200px" onclick="submitFeedback()">Submit Feedback</button>
        <div class="feedback-msg" id="feedback-msg"></div>
      </div>
    </div>`;
}

function setFeedbackRating(n) {
  state.feedbackRating = n;
  document.querySelectorAll('.feedback-star').forEach((el, i) => el.classList.toggle('active', i < n));
}

async function submitFeedback() {
  const msgEl = document.getElementById('feedback-msg');
  const textEl = document.getElementById('feedback-message');
  if (!state.feedbackRating) {
    msgEl.textContent = 'Please pick a star rating first.';
    msgEl.className = 'feedback-msg err';
    return;
  }
  try {
    const res = await ajax('api/feedback', 'POST', {
      userId: state.userData ? (state.userData.email || state.userData.name) : 'guest',
      subject: state.activeSubject || null,
      rating: state.feedbackRating,
      message: textEl.value.trim(),
    });
    if (res && res.success) {
      msgEl.textContent = 'Thanks — your feedback was submitted!';
      msgEl.className = 'feedback-msg ok';
      state.feedbackRating = 0;
      textEl.value = '';
      document.querySelectorAll('.feedback-star').forEach(el => el.classList.remove('active'));
      try {
        const stats = await ajax('api/feedback');
        if (stats && stats.success) { state.feedbackStats = stats.data; renderDashboardHTML(); }
      } catch {}
    } else {
      msgEl.textContent = 'Could not submit feedback — please try again.';
      msgEl.className = 'feedback-msg err';
    }
  } catch {
    msgEl.textContent = 'Network error — please try again.';
    msgEl.className = 'feedback-msg err';
  }
}

// ══════════════════════════════════════════
//  USER / MODAL / SIGN OUT
// ══════════════════════════════════════════
function updateUserUI() {
  const u = state.userData;
  const btn = document.getElementById('user-btn');
  const guestNote = document.getElementById('dd-guest-note');
  if (u) {
    btn.textContent = u.name ? u.name.charAt(0).toUpperCase() : '?';
    document.getElementById('dd-name').textContent = u.name || 'Guest';
    document.getElementById('dd-email').textContent = u.email || '';
    if (guestNote) guestNote.textContent = '';
  } else {
    btn.textContent = '?';
    document.getElementById('dd-name').textContent = 'Guest';
    document.getElementById('dd-email').textContent = '';
    if (guestNote) guestNote.textContent = "You're browsing as a guest — your progress won't be saved.";
  }
}

function setModalMode(mode) {
  state.modalMode = mode;
  document.getElementById('mode-register-btn').classList.toggle('active', mode === 'register');
  document.getElementById('mode-login-btn').classList.toggle('active', mode === 'login');
  document.getElementById('field-name').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('field-mobile').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('field-source').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('f-email-label').textContent = mode === 'register' ? 'Email Address' : 'Your Registered Email';
  document.getElementById('modal-sub').innerHTML = mode === 'register'
    ? 'Enter your details to save progress &amp; get updates.<br><em>All fields are optional.</em>'
    : 'Enter the email you registered with to pick up your saved progress.';
  document.getElementById('modal-submit').textContent = mode === 'register' ? 'Start Practising →' : 'Log In →';
  const statusEl = document.getElementById('login-status');
  statusEl.textContent = '';
  statusEl.className = 'login-status';
}

function validateModal() {
  let ok = true;
  const email = document.getElementById('f-email').value.trim();
  const mobile = document.getElementById('f-mobile').value.trim();

  document.getElementById('err-name').textContent = '';
  document.getElementById('err-email').textContent = '';
  document.getElementById('err-mobile').textContent = '';
  document.getElementById('f-name').classList.remove('err');
  document.getElementById('f-email').classList.remove('err');
  document.getElementById('f-mobile').classList.remove('err');

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('err-email').textContent = 'Invalid email address';
    document.getElementById('f-email').classList.add('err');
    ok = false;
  }
  if (mobile && !/^\+?[\d\s\-]{7,15}$/.test(mobile)) {
    document.getElementById('err-mobile').textContent = 'Invalid mobile number';
    document.getElementById('f-mobile').classList.add('err');
    ok = false;
  }
  return ok;
}

function handleModalSubmit() {
  if (state.modalMode === 'login') {
    handleLogin();
  } else {
    submitModal();
  }
}

async function submitModal() {
  if (!validateModal()) return;
  const formData = {
    name: document.getElementById('f-name').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    mobile: document.getElementById('f-mobile').value.trim(),
    source: document.getElementById('f-source').value,
  };

  const optimistic = { ...formData, timestamp: new Date().toISOString() };
  state.userData = optimistic;
  localStorage.setItem('unic_user', JSON.stringify(optimistic));
  updateUserUI();
  document.getElementById('modal-overlay').classList.add('hidden');

  try {
    const res = await ajax('api/register', 'POST', formData);
    if (res && res.success && res.data) {
      state.userData = res.data;
      localStorage.setItem('unic_user', JSON.stringify(res.data));
      updateUserUI();
    }
  } catch { /* offline / server hiccup — keep the optimistic local profile */ }

  if (state.view === 'dashboard') showDashboard();
}

async function handleLogin() {
  const email = document.getElementById('f-email').value.trim();
  const statusEl = document.getElementById('login-status');
  document.getElementById('f-email').classList.remove('err');
  statusEl.textContent = '';
  statusEl.className = 'login-status';

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('f-email').classList.add('err');
    statusEl.textContent = 'Enter a valid email to log in.';
    statusEl.classList.add('err-msg');
    return;
  }

  const btn = document.getElementById('modal-submit');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Checking…';

  try {
    const res = await ajax('api/register', 'POST', { email });
    if (res && res.success && res.data) {
      state.userData = res.data;
      localStorage.setItem('unic_user', JSON.stringify(res.data));
      updateUserUI();
      document.getElementById('modal-overlay').classList.add('hidden');
      if (state.view === 'dashboard') showDashboard();
    } else {
      statusEl.textContent = 'No saved profile found for that email — you can register instead.';
      statusEl.classList.add('err-msg');
    }
  } catch {
    statusEl.textContent = "Couldn't reach the server to log in. Please try again, or register instead.";
    statusEl.classList.add('err-msg');
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function signOut() {
  localStorage.removeItem('unic_user');
  sessionStorage.clear();

  state.userData = null;
  state.answers = {};
  state.submitted = {};
  state.subjectData = null;
  state.activeChapterId = null;
  state.questionIndex = 0;
  state.qtypeFilter = 'ALL';
  state.sqlDb = null;
  state.sqlLoadedChapterId = null;
  state.dashboardStats = null;

  document.getElementById('user-dropdown').classList.remove('open');
  updateUserUI();
  showHome();

  ['f-name','f-email','f-mobile'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-source').value = '';
  setModalMode('register');

  document.getElementById('modal-overlay').classList.remove('hidden');
}

// ══════════════════════════════════════════
//  EVENT BINDINGS
// ══════════════════════════════════════════
function bindEvents() {
  document.getElementById('modal-submit').addEventListener('click', handleModalSubmit);
  document.getElementById('modal-skip').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.add('hidden');
  });
  document.getElementById('f-name').addEventListener('keydown', e => { if(e.key==='Enter') handleModalSubmit(); });
  document.getElementById('f-email').addEventListener('keydown', e => { if(e.key==='Enter') handleModalSubmit(); });

  document.getElementById('brand-home-btn').addEventListener('click', showHome);
  document.getElementById('home-nav-btn').addEventListener('click', showHome);
  document.getElementById('dashboard-nav-btn').addEventListener('click', showDashboard);

  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    state.sidebarOpen = !state.sidebarOpen;
    document.getElementById('sidebar').classList.toggle('closed', !state.sidebarOpen);
  });

  document.getElementById('user-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('user-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', () => {
    document.getElementById('user-dropdown').classList.remove('open');
  });

  document.getElementById('dd-signout').addEventListener('click', signOut);

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox-overlay') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
}

// ── Start ──
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
